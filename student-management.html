<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management | JPS Dambal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #ede9fe, #fef3c7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 35px 25px;
      background: white;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(30, 41, 59, 0.15);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      color: #164e8a;
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">🎓</div>

    <h1>Student Management</h1>

    <p>
      Jnyanabindu Public School, Dambal
    </p>

    <p>
      Open the admin dashboard to create and manage student records.
      You must sign in with your authorised admin account.
    </p>

    <a href="admin-dashboard.html?page=students">
      Open Student Management
    </a>
  </main>
</body>
</html>
